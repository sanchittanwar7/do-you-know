<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview — do.you.know.7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=EB+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <span class="badge-pill">Preview</span>
        <h1 class="display-xl">{{ draft.question }}</h1>
      </div>

      <div class="preview-grid">
        <figure class="preview-slide">
          <img src="/img/{{ draft_id }}/0" alt="Question slide">
          <figcaption class="slide-caption caption">Slide 1 · Question</figcaption>
        </figure>
        <figure class="preview-slide">
          <img src="/img/{{ draft_id }}/1" alt="Short answer slide">
          <figcaption class="slide-caption caption">Slide 2 · Short answer</figcaption>
        </figure>
        <figure class="preview-slide">
          <img src="/img/{{ draft_id }}/2" alt="Long answer slide">
          <figcaption class="slide-caption caption">Slide 3 · The why</figcaption>
        </figure>
      </div>

      <div class="preview-answers">
        <div class="answer">
          <span class="caption-uppercase text-muted-soft">Short answer</span>
          <p class="body-strong">{{ draft.short }}</p>
        </div>
        <div class="answer">
          <span class="caption-uppercase text-muted-soft">The why</span>
          <p class="body-md">{{ draft.long }}</p>
        </div>
      </div>

      {% if draft.caption %}
      <div class="answer caption-box">
        <span class="caption-uppercase text-muted-soft">Instagram caption</span>
        <pre class="caption-text">{{ draft.caption }}</pre>
      </div>
      {% endif %}

      <div class="answer caption-box">
        <span class="caption-uppercase text-muted-soft">First comment (short + long answer)</span>
        <pre class="caption-text">{{ draft.short }}

{{ draft.long }}</pre>
      </div>

      <div class="preview-ctas">
        <form action="/publish/{{ draft_id }}" method="post" style="margin:0">
          <button class="btn btn-primary" type="submit">Post to Instagram</button>
        </form>
        <form action="/generate" method="post" style="margin:0">
          <input type="hidden" name="question" value="{{ draft.question }}">
          <button class="btn btn-outline" type="submit">Regenerate</button>
        </form>
      </div>

      <a class="back-link" href="/">← New question</a>
    </div>
  </section>

</body>
</html>
